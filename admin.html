<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 Not Found</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 5rem;
      margin: 0;
      font-weight: 800;
      color: #64748b;
      line-height: 1;
    }
    h2 {
      font-size: 1.4rem;
      margin: 12px 0 16px;
      color: #1e293b;
    }
    p {
      color: #64748b;
      max-width: 420px;
      margin: 0 0 24px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 10px 24px;
      background: #0f172a;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you are looking for does not exist, has been removed, or is temporarily unavailable.</p>
  <a href="index.html">Return to Home</a>
</body>
</html>
